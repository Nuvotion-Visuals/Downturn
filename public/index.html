<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Downturn</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
:root {
  /* Colors */
  --color-bg: #0d1117;
  --color-bg-secondary: #161b22;
  --color-bg-tertiary: #21262d;
  --color-border: #30363d;
  --color-border-hover: #8b949e;
  --color-text: #e6edf3;
  --color-text-muted: #8b949e;
  --color-text-placeholder: #6e7681;
  --color-link: #58a6ff;
  --color-accent: #1f6feb;
  --color-accent-alpha: rgba(31, 111, 235, 0.3);
  --color-danger: #f85149;
  --color-white: #fff;
  --color-shadow: rgba(0, 0, 0, 0.3);
  --color-shadow-heavy: rgba(0, 0, 0, 0.4);
  /* Typography */
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-xs: .75rem;
  --font-sm: .875rem;
  --font-base: 1rem;
  --font-code: 85%;
  /* Spacing */
  --space-xs: 2px;
  --space-sm: 4px;
  --space-md: 8px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  /* Radii */
  --radius-sm: 3px;
  --radius: 6px;
  /* Controls */
  --control-h: 32px;
  --control-h-sm: 28px;
  --control-px: 12px;
  /* Sizes */
  --icon-sm: 10px;
  --icon-md: 14px;
  --icon-lg: 16px;
  --sidebar-w: 220px;
  --tab-w: 180px;
  --content-max-w: 700px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { color-scheme: dark light; }
body {
  font-family: var(--font-family);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.5;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }
/* Tab bar */
.tabbar {
  display: flex;
  align-items: stretch;
  background: var(--color-bg);
  padding: var(--space-md) var(--space-md) 0;
  flex-shrink: 0;
  gap: var(--space-sm);
  border-bottom: 1px solid var(--color-border);
}
.tabs {
  display: flex;
  gap: var(--space-xs);
  min-width: 0;
  flex-wrap: nowrap;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  height: var(--control-h);
  padding: 0 var(--control-px);
  width: var(--tab-w);
  background: var(--color-bg-tertiary);
  border: 1px solid var(--color-border);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  color: var(--color-text-muted);
  font-size: var(--font-xs);
  cursor: pointer;
  flex-shrink: 0;
}
.tab:hover { color: var(--color-text); }
.tab.drag-over-left { box-shadow: -2px 0 0 0 var(--color-accent); }
.tab.drag-over-right { box-shadow: 2px 0 0 0 var(--color-accent); }
.tab.dragging { opacity: 0.4; }
.tab.active {
  background: var(--color-bg-secondary);
  color: var(--color-text);
  border-color: var(--color-border);
  box-shadow: 0 1px 0 0 var(--color-bg-secondary);
}
.tab-icon, .sidebar-icon { width: 16px; height: 16px; flex-shrink: 0; border-radius: var(--space-xs); }
.tab-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.tab-close {
  display: none;
  width: var(--icon-lg);
  height: var(--icon-lg);
  line-height: var(--icon-lg);
  text-align: center;
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  flex-shrink: 0;
}
.tab-close:hover { background: var(--color-border); }
.tab:hover .tab-close, .tab.active .tab-close { display: block; }
.tab-new {
  width: var(--control-h-sm);
  height: var(--control-h-sm);
  background: none;
  border: none;
  border-radius: var(--radius);
  color: var(--color-text-muted);
  font-size: var(--font-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  align-self: center;
}
.icon { display: inline-block; background: currentColor; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; forced-color-adjust: none; }
.icon-plus { -webkit-mask-image: url(/images/icons/plus.svg); mask-image: url(/images/icons/plus.svg); }
.icon-sidebar { -webkit-mask-image: url(/images/icons/sidebar.svg); mask-image: url(/images/icons/sidebar.svg); }
.icon-back { -webkit-mask-image: url(/images/icons/back.svg); mask-image: url(/images/icons/back.svg); }
.icon-forward { -webkit-mask-image: url(/images/icons/forward.svg); mask-image: url(/images/icons/forward.svg); }
.icon-refresh { -webkit-mask-image: url(/images/icons/refresh.svg); mask-image: url(/images/icons/refresh.svg); }
.icon-home { -webkit-mask-image: url(/images/icons/home.svg); mask-image: url(/images/icons/home.svg); }
.icon-file { -webkit-mask-image: url(/images/icons/file.svg); mask-image: url(/images/icons/file.svg); }
.icon-folder { -webkit-mask-image: url(/images/icons/folder.svg); mask-image: url(/images/icons/folder.svg); }
.icon-bookmark-outline { -webkit-mask-image: url(/images/icons/bookmark-outline.svg); mask-image: url(/images/icons/bookmark-outline.svg); }
.icon-bookmark-filled { -webkit-mask-image: url(/images/icons/bookmark-filled.svg); mask-image: url(/images/icons/bookmark-filled.svg); }
.icon-settings { -webkit-mask-image: url(/images/icons/settings.svg); mask-image: url(/images/icons/settings.svg); }
.icon-right-sidebar { -webkit-mask-image: url(/images/icons/right-sidebar.svg); mask-image: url(/images/icons/right-sidebar.svg); }
.icon-copy { -webkit-mask-image: url(/images/icons/copy.svg); mask-image: url(/images/icons/copy.svg); }
.icon-download { -webkit-mask-image: url(/images/icons/download.svg); mask-image: url(/images/icons/download.svg); }
.icon-open-external { -webkit-mask-image: url(/images/icons/open-external.svg); mask-image: url(/images/icons/open-external.svg); }
.icon-zen-expand { -webkit-mask-image: url(/images/icons/zen-expand.svg); mask-image: url(/images/icons/zen-expand.svg); }
.icon-zen-collapse { -webkit-mask-image: url(/images/icons/zen-collapse.svg); mask-image: url(/images/icons/zen-collapse.svg); }
.icon-chevron-right { -webkit-mask-image: url(/images/icons/chevron-right.svg); mask-image: url(/images/icons/chevron-right.svg); }
.tab-new .icon { width: var(--icon-md); height: var(--icon-md); }
.tab-new:hover { background: var(--color-bg-tertiary); color: var(--color-text); }
/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md);
  background: var(--color-bg-secondary);
  flex-shrink: 0;
}
.nav-btn {
  height: var(--control-h);
  width: var(--control-h);
  padding: 0;
  background: none;
  border: none;
  border-radius: var(--radius);
  color: var(--color-text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn .icon { width: var(--icon-md); height: var(--icon-md); }
.nav-btn:hover { background: var(--color-bg-tertiary); color: var(--color-text); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { background: none; }
.topbar-sep { width: 1px; height: 20px; background: var(--color-border); flex-shrink: 0; }
#urlInput {
  height: var(--control-h);
  padding: 0 var(--control-px);
  font-size: var(--font-sm);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  color: var(--color-text);
  line-height: var(--control-h);
  outline: none;
}
#urlInput:focus { border-color: var(--color-link); box-shadow: 0 0 0 3px var(--color-accent-alpha); }
#urlInput::placeholder { color: var(--color-text-placeholder); }
.topbar-right { display: flex; gap: var(--space-md); align-items: center; }
/* Loading */
#loading {
  display: none;
  width: var(--icon-lg); height: var(--icon-lg);
  border: 2px solid var(--color-border);
  border-top-color: var(--color-link);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Settings popover */
.settings-wrap { position: relative; }
#settingsPopover {
  display: none;
  position: absolute;
  top: 40px;
  right: 0;
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--control-px) var(--space-lg);
  z-index: 10;
  min-width: 200px;
  box-shadow: 0 var(--space-md) var(--space-xl) var(--color-shadow-heavy);
}
#settingsPopover.open { display: block; }
#settingsPopover label {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) 0;
  font-size: var(--font-sm);
  color: var(--color-text);
  cursor: pointer;
}
.settings-section {
  font-size: var(--font-xs);
  color: var(--color-text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: var(--space-md) 0 var(--space-sm);
  border-top: 1px solid var(--color-border);
  margin-top: var(--space-md);
}
.settings-section:first-child { border-top: none; margin-top: 0; }
.theme-picker {
  display: flex;
  gap: var(--space-sm);
  padding: var(--space-sm) 0;
}
.theme-btn {
  flex: 1;
  padding: var(--space-sm) var(--space-md);
  font-size: var(--font-xs);
  background: var(--color-bg-tertiary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  color: var(--color-text-muted);
  cursor: pointer;
  text-align: center;
}
.theme-btn:hover { color: var(--color-text); border-color: var(--color-border-hover); }
.theme-btn.active { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-white); }
/* Right sidebar content */
.right-sidebar-content {
  padding: var(--space-lg);
}
.right-sidebar-content select {
  width: 100%;
  height: var(--control-h-sm);
  padding: 0 var(--space-md);
  font-size: var(--font-xs);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  color: var(--color-text);
  margin-top: var(--space-xs);
}
.range-control {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) 0;
}
.range-control input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--color-accent);
  height: 4px;
}
.range-value {
  font-size: var(--font-xs);
  color: var(--color-text-muted);
  min-width: 40px;
  text-align: right;
  font-family: var(--font-mono);
}
.font-list {
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  margin-top: var(--space-xs);
}
.font-item {
  padding: var(--space-sm) var(--space-md);
  cursor: pointer;
  font-size: var(--font-sm);
  color: var(--color-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.font-item:hover { background: var(--color-bg-tertiary); color: var(--color-text); }
.font-item.active { background: var(--color-accent); color: var(--color-white); }
/* Main layout */
.main-area { flex: 1; display: flex; overflow: hidden; }
/* Split pane */
.panes {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-width: 0;
  border-top: 1px solid var(--color-border);
}
.pane {
  flex: 1;
  overflow: auto;
  padding: var(--space-xl) var(--space-2xl);
}
.pane::-webkit-scrollbar { width: var(--space-md); }
.pane::-webkit-scrollbar-track { background: transparent; }
.pane::-webkit-scrollbar-thumb { background: var(--color-bg-tertiary); }
.pane::-webkit-scrollbar-thumb:hover { background: var(--color-border-hover); }
#rawPane {
  font-family: var(--font-mono);
  font-size: var(--font-sm);
  line-height: 1.6;
  word-break: break-word;
  border-right: 1px solid var(--color-border);
  border-top: none; border-bottom: none; border-left: none;
  user-select: text;
  color: var(--color-text);
  background: var(--color-bg);
  resize: none;
  outline: none;
}
#rawPane::placeholder { color: var(--color-text-placeholder); }
.panes.single .pane {
  border-right: none;
  max-width: none;
  padding-left: max(var(--space-2xl), calc((100% - var(--content-max-w)) / 2));
  padding-right: max(var(--space-2xl), calc((100% - var(--content-max-w)) / 2));
}
.panes.single .divider { display: none; }
.divider {
  width: var(--space-sm);
  cursor: col-resize;
  background: var(--color-border);
  flex-shrink: 0;
}
.divider:hover { background: var(--color-link); }
/* Preview pane — GitHub markdown-body styling */
#previewPane {
  font-size: var(--font-base);
  line-height: 1.5;
  word-wrap: break-word;
  color: var(--color-text);
}
#previewPane h1 { font-size: 2em; font-weight: 600; margin: 0 0 var(--space-lg); padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
#previewPane h2 { font-size: 1.5em; font-weight: 600; margin: var(--space-xl) 0 var(--space-lg); padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
#previewPane h3 { font-size: 1.25em; font-weight: 600; margin: var(--space-xl) 0 var(--space-lg); }
#previewPane h4 { font-size: 1em; font-weight: 600; margin: var(--space-xl) 0 var(--space-lg); }
#previewPane h5 { font-size: var(--font-sm); font-weight: 600; margin: var(--space-xl) 0 var(--space-lg); }
#previewPane h6 { font-size: var(--font-xs); font-weight: 600; margin: var(--space-xl) 0 var(--space-lg); color: var(--color-text-muted); }
#previewPane p { margin: 0 0 var(--space-lg); }
#previewPane a { color: var(--color-link); text-decoration: none; cursor: pointer; }
#previewPane a:hover { text-decoration: underline; }
#previewPane img { max-width: 100%; height: auto; border-radius: var(--radius); margin: var(--space-md) 0; }
#previewPane pre {
  background: var(--color-bg-secondary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: var(--space-lg);
  overflow-x: auto;
  margin: 0 0 var(--space-lg);
  line-height: 1.45;
}
#previewPane code {
  font-family: var(--font-mono);
  font-size: var(--font-code);
}
#previewPane :not(pre) > code {
  background: var(--color-bg-tertiary);
  padding: 0.2em 0.4em;
  border-radius: var(--radius);
  font-size: var(--font-code);
}
#previewPane blockquote {
  border-left: 0.25em solid var(--color-border);
  padding: 0 1em;
  margin: 0 0 var(--space-lg);
  color: var(--color-text-muted);
}
#previewPane ul, #previewPane ol { padding-left: 2em; margin: 0 0 var(--space-lg); }
#previewPane li { margin: 0.25em 0; }
#previewPane li + li { margin-top: 0.25em; }
#previewPane del { opacity: 0.7; }
#previewPane .task-list-item { list-style: none; margin-left: -1.2em; }
#previewPane .task-list-item input { margin-right: 0.5em; }
#previewPane hr { border: none; border-top: 1px solid var(--color-border); margin: var(--space-xl) 0; height: 0.25em; background: var(--color-border); border-radius: var(--space-xs); }
#previewPane sup.footnote-ref { font-size: 0.75em; }
#previewPane sup.footnote-ref a { text-decoration: none; padding: 0 0.1em; }
#previewPane .footnotes { margin-top: var(--space-xl); font-size: var(--font-sm); color: var(--color-text-muted); }
#previewPane .footnotes ol { padding-left: 1.5em; }
#previewPane .footnotes li { margin: 0.35em 0; }
#previewPane .footnotes li:target { background: var(--color-bg-secondary); border-radius: var(--radius); }
#previewPane .footnote-back { text-decoration: none; margin-left: 0.35em; }
@keyframes fnFlash { 0% { background: var(--color-bg-secondary); } 100% { background: transparent; } }
#previewPane .fn-flash { animation: fnFlash 1.2s ease-out; border-radius: var(--radius); }
#previewPane table { border-collapse: collapse; margin: 0 0 var(--space-lg); width: auto; display: block; overflow-x: auto; }
#previewPane th, #previewPane td { border: 1px solid var(--color-border); padding: var(--space-md) var(--control-px); }
#previewPane th { font-weight: 600; background: var(--color-bg-secondary); }
#previewPane tr:nth-child(2n) { background: var(--color-bg-secondary); }
#previewPane strong { font-weight: 600; }
.sidebar-mobile-toolbar { display: none; }
/* Nav sidebar */
.nav-sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid var(--color-border);
  background: var(--color-bg-secondary);
  display: none;
  font-size: var(--font-xs);
}
.nav-sidebar.open { display: flex; flex-direction: column; }
.nav-sidebar ul { list-style: none; padding: var(--space-md) 0; }
.nav-sidebar li a {
  display: block;
  padding: var(--space-sm) var(--space-lg);
  color: var(--color-text-muted);
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-sidebar li a:hover { color: var(--color-link); background: var(--color-bg-tertiary); }
.nav-sidebar li a.active { color: var(--color-text); background: var(--color-bg-tertiary); font-weight: 600; }
.nav-sidebar .nav-empty { padding: var(--space-lg); color: var(--color-text-placeholder); text-align: center; font-style: italic; }
.file-tree-dir {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 2px var(--space-lg);
  color: var(--color-text);
  font-weight: 600;
  font-size: var(--font-xs);
  cursor: pointer;
  user-select: none;
}
.file-tree-dir .icon-chevron-right { width: var(--icon-sm); height: var(--icon-sm); transition: transform 0.15s; flex-shrink: 0; }
.file-tree-dir .file-tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-add-btn { visibility: hidden; pointer-events: none; background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: 2px; border-radius: var(--radius-sm); flex-shrink: 0; }
.tree-add-btn .icon { width: var(--icon-sm); height: var(--icon-sm); }
.file-tree-dir:hover .tree-add-btn { visibility: visible; pointer-events: auto; }
.tree-add-btn:hover { background: var(--color-bg-tertiary); color: var(--color-text); }
.file-tree-group.open > .file-tree-dir .icon-chevron-right { transform: rotate(90deg); }
.file-tree-children { margin: 0; padding: 0; list-style: none; }
.file-tree-group > .file-tree-children { display: none; }
.file-tree-group.open > .file-tree-children { display: block; }
.file-tree-item {
  display: block;
  padding: 2px var(--space-lg);
  color: var(--color-text-muted);
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  font-size: var(--font-xs);
}
.file-tree-item:hover { color: var(--color-link); background: var(--color-bg-tertiary); }
.file-tree-item.active { color: var(--color-text); background: var(--color-bg-tertiary); font-weight: 600; }
.file-tree-item[draggable], .file-tree-dir[draggable] { cursor: grab; }
.file-tree-item.dragging, .file-tree-group.dragging > .file-tree-dir { opacity: 0.4; }
.drop-target { outline: 2px solid var(--color-accent); outline-offset: -2px; border-radius: var(--radius-sm); }
.drop-above { box-shadow: 0 -2px 0 0 var(--color-accent) inset; }
.drop-below { box-shadow: 0 2px 0 0 var(--color-accent) inset; }
#sidebarNotes ul { margin: 0; padding: 0; list-style: none; }
.notes-header { display: flex; justify-content: flex-end; padding: 2px var(--space-md) 0; flex-shrink: 0; }
.notes-new-btn { background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: var(--space-sm); border-radius: var(--radius); }
.notes-new-btn:hover { background: var(--color-bg-tertiary); color: var(--color-text); }
.notes-empty { padding: var(--space-xl); text-align: center; color: var(--color-text-muted); font-size: var(--font-xs); }
.notes-empty p { margin-bottom: var(--space-md); }
.notes-empty-actions { display: flex; gap: var(--space-md); justify-content: center; }
.notes-empty-btn { padding: var(--space-sm) var(--space-lg); font-size: var(--font-xs); background: var(--color-bg-tertiary); border: 1px solid var(--color-border); border-radius: var(--radius); color: var(--color-text); cursor: pointer; }
.notes-empty-btn:hover { border-color: var(--color-border-hover); }
.notes-new-btn .icon { width: var(--icon-sm); height: var(--icon-sm); }

<script type="module">
import { markdownToHtml, inline, esc, normalizeUrl, formatStats, debounce, faviconUrl, resolveOmnibox, parseWikiLinks, toggleTaskAt } from './ui.mjs';
import * as db from './db.mjs';
import { THEMES, applyTheme, getSystemTheme, listFonts } from './themes.mjs';
const API_BASE = '';

// Settings persistence
let currentThemeName = 'auto';

function saveSettings() {
  const settings = {
    optTitle: document.getElementById('optTitle').checked,
    optLinks: document.getElementById('optLinks').checked,
    optImages: document.getElementById('optImages').checked,
    optClean: document.getElementById('optClean').checked,
    optAbsolute: document.getElementById('optAbsolute').checked,
    optTimestamps: document.getElementById('optTimestamps').checked,
    view: document.querySelector('.vt-btn.active')?.dataset.view || 'both',
    navOpen: document.getElementById('navSidebar').classList.contains('open'),
    sidebarTab: document.querySelector('.sidebar-tab.active')?.dataset.sidebar || 'nav',
    collapsedFolders: [...(document.getElementById('sidebarNotes').querySelectorAll('.file-tree-group:not(.open) .file-tree-dir[data-path]'))].map(el => el.dataset.path),
    theme: currentThemeName,
    fontEditor: document.getElementById('fontEditor').querySelector('.font-item.active')?.dataset.font || null,
    fontPreview: document.getElementById('fontPreview').querySelector('.font-item.active')?.dataset.font || null,
    fontSize: document.getElementById('fontSizeRange').value,
    lineHeight: document.getElementById('lineHeightRange').value,
    lineWidth: document.getElementById('lineWidthRange').value,
  };
  db.saveSettings(settings);
}
function applyView(view) {
  document.querySelectorAll('.vt-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.vt-btn[data-view="${view}"]`);
  if (btn) btn.classList.add('active');
  const panes = document.querySelector('.panes');
  document.getElementById('rawPane').style.display = (view === 'preview') ? 'none' : '';
  document.getElementById('previewPane').style.display = (view === 'raw') ? 'none' : '';
  panes.classList.toggle('single', view !== 'both');
}
async function loadSettings() {
  try {
    const s = await db.getSettings();
    if (!s) return false;
    if (s.optTitle !== undefined) document.getElementById('optTitle').checked = s.optTitle;
    if (s.optLinks !== undefined) document.getElementById('optLinks').checked = s.optLinks;
    if (s.optImages !== undefined) document.getElementById('optImages').checked = s.optImages;
    if (s.optClean !== undefined) document.getElementById('optClean').checked = s.optClean;
    if (s.optAbsolute !== undefined) document.getElementById('optAbsolute').checked = s.optAbsolute;
    if (s.optTimestamps !== undefined) document.getElementById('optTimestamps').checked = s.optTimestamps;
    let view = s.view;
    if (view === 'both' && window.innerWidth < 640) view = 'preview';
    if (view) applyView(view);
    const sidebar = document.getElementById('navSidebar');
    if (s.navOpen && window.innerWidth >= 640) sidebar.classList.add('open');
    else sidebar.classList.remove('open');
    if (s.sidebarTab) {
      document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
      const tab = document.querySelector(`.sidebar-tab[data-sidebar="${s.sidebarTab}"]`);
      if (tab) tab.classList.add('active');
      document.querySelectorAll('.sidebar-content').forEach(el => el.style.display = 'none');
      const panelId = 'sidebar' + s.sidebarTab.charAt(0).toUpperCase() + s.sidebarTab.slice(1);
      const panel = document.getElementById(panelId);
      if (panel) panel.style.display = '';
      if (s.sidebarTab === 'bookmarks') renderBookmarksSidebar();
      if (s.sidebarTab === 'history') renderHistorySidebar();
      if (s.sidebarTab === 'notes') renderNotesSidebar(Array.isArray(s.collapsedFolders) ? new Set(s.collapsedFolders) : null);
    }
    // Theme
    if (s.theme) {
      currentThemeName = s.theme;
      setTheme(s.theme);
    }
    // Fonts
    if (s.fontEditor) {
      document.documentElement.style.setProperty('--font-mono', `"${s.fontEditor}", ui-monospace, monospace`);
    }
    if (s.fontPreview) {
      document.documentElement.style.setProperty('--font-family', `"${s.fontPreview}", -apple-system, sans-serif`);
    }
    return true;
  } catch { return false; }
}

// Elements
const urlInput = document.getElementById('urlInput');
const rawPane = document.getElementById('rawPane');
const previewPane = document.getElementById('previewPane');
const navSidebar = document.getElementById('navSidebar');
const loading = document.getElementById('loading');
const statusEl = document.getElementById('status');
const stats = document.getElementById('stats');
const divider = document.getElementById('divider');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPopover = document.getElementById('settingsPopover');
const tabContainer = document.getElementById('tabContainer');

// Tab state
let tabs = [];
let activeTabId = 0;
let nextTabId = 1;
const pageCache = {};
let folderHandle = null;
let folderTree = [];
let fileHandles = new Map();

function saveTabs() {
  const data = {
    tabs: tabs.map(t => ({ id: t.id, url: t.url, markdown: t.markdown, nav: t.nav, stats: t.stats, source: t.source, filePath: t.filePath })),
    activeTabId,
    nextTabId,
  };
  db.saveTabs(data);
}

async function loadTabs() {
  try {
    const data = await db.getTabs();
    if (!data || !data.tabs?.length) return false;
    tabs = data.tabs.map(t => ({ ...t, rawScroll: 0, previewScroll: 0 }));
    activeTabId = data.activeTabId;
    nextTabId = data.nextTabId;
    // Repopulate pageCache from tab data
    for (const t of tabs) {
      if (t.url && t.markdown) pageCache[t.url] = { markdown: t.markdown, nav: t.nav };
    }
    return true;
  } catch { return false; }
}

function getTab(id) { return tabs.find(t => t.id === id); }
function getActiveTab() { return getTab(activeTabId); }

function tabTitle(tab) {
  if (tab.filePath) return tab.filePath;
  if (tab.markdown) {
    const m = tab.markdown.match(/^#\s+(.+)/m);
    if (m) return m[1].slice(0, 40);
  }
  if (tab.url) {
    try { return new URL(tab.url).hostname; } catch {}
  }
  return 'Start Page';
}

function renderTabs() {
  tabContainer.innerHTML = tabs.map(t => {
    const icon = `<img class="tab-icon" src="${t.url && !t.url.startsWith('__search__:') ? faviconUrl(t.url) : '/favicon.svg'}">`;
    return `<div class="tab${t.id === activeTabId ? ' active' : ''}" data-tab-id="${t.id}" draggable="true">` +
    `${icon}<span class="tab-title">${tabTitle(t)}</span>` +
    `<span class="tab-close">&times;</span></div>`;
  }).join('');
  saveTabs();
  // Scroll active tab into view on narrow screens
  requestAnimationFrame(() => {
    tabContainer.querySelector('.tab.active')?.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  });
}

function saveTabScroll() {
  const tab = getActiveTab();
  if (tab) {
    tab.rawScroll = rawPane.scrollTop;
    tab.previewScroll = previewPane.scrollTop;
  }
}

function applyTimestamps(md) {
  if (document.getElementById('optTimestamps').checked) return md;
  return md.replace(/\*\*\d+:\d+\*\*\s*/g, '');
}

function displayTab(tab) {
  urlInput.value = tab.filePath || tab.url || '';
  if (tab.markdown) {
    const display = applyTimestamps(tab.markdown);
    rawPane.value = display;
    previewPane.innerHTML = markdownToHtml(display);
    if (tab.source === 'file') resolveFolderImages(tab.filePath);
    document.getElementById('copyBtn').disabled = false;
    document.getElementById('downloadBtn').disabled = false;
  } else {
    rawPane.value = '';
    previewPane.innerHTML = '<div class="empty-state">Rendered preview will appear here</div>';
    document.getElementById('copyBtn').disabled = true;
    document.getElementById('downloadBtn').disabled = true;
  }
  document.getElementById('openBtn').style.display = (tab.url && !tab.url.startsWith('__search__:')) ? '' : 'none';
  // Show file tree or nav depending on tab source
  if (folderTree.length && (tab.source === 'file' || !tab.url)) {
    renderFileTree(folderTree);
  } else {
    renderNav(tab.nav || null);
  }
  stats.textContent = tab.stats || '';
  statusEl.textContent = '';
  requestAnimationFrame(() => {
    rawPane.scrollTop = tab.rawScroll || 0;
    previewPane.scrollTop = tab.previewScroll || 0;
  });
  window.history.replaceState({ url: tab.url }, '', tab.url ? '#' + tab.url : window.location.pathname);
  updateBookmarkBtn();
}

function switchTab(id) {
  if (id === activeTabId) return;
  saveTabScroll();
  activeTabId = id;
  renderTabs();
  displayTab(getActiveTab());
}

function createTab(url, { startPage = true } = {}) {
  const tab = { id: nextTabId++, url: '', markdown: '', nav: [], stats: '', rawScroll: 0, previewScroll: 0 };
  tabs.push(tab);
  saveTabScroll();
  activeTabId = tab.id;
  renderTabs();
  displayTab(tab);
  if (url) {
    navigate(url);
  } else if (startPage) {
    loadStartPage(tab);
    urlInput.focus();
  }
  return tab;
}

async function loadStartPage(tab) {
  try {
    const resp = await fetch('/start.md');
    if (!resp.ok) return;
    const md = await resp.text();
    tab.markdown = md;
    if (getActiveTab() === tab) {
      rawPane.value = md;
      previewPane.innerHTML = markdownToHtml(md);
      document.getElementById('copyBtn').disabled = false;
      document.getElementById('downloadBtn').disabled = false;
    }
    renderTabs();
  } catch {}
}

function closeTab(id) {
  const idx = tabs.findIndex(t => t.id === id);
  if (idx === -1) return;
  tabs.splice(idx, 1);
  if (tabs.length === 0) {
    createTab();
    return;
  }
  if (activeTabId === id) {
    activeTabId = tabs[Math.min(idx, tabs.length - 1)].id;
    displayTab(getActiveTab());
  }
  renderTabs();
}

// Tab bar events
tabContainer.addEventListener('click', (e) => {
  const close = e.target.closest('.tab-close');
  if (close) {
    const tabEl = close.closest('.tab');
    closeTab(Number(tabEl.dataset.tabId));
    return;
  }
  const tabEl = e.target.closest('.tab');
  if (tabEl) switchTab(Number(tabEl.dataset.tabId));
});
tabContainer.addEventListener('auxclick', (e) => {
  if (e.button !== 1) return;
  const tabEl = e.target.closest('.tab');
  if (tabEl) { e.preventDefault(); closeTab(Number(tabEl.dataset.tabId)); }
});
document.getElementById('newTabBtn').addEventListener('click', () => createTab());

// Tab drag reorder
let dragTabId = null;
tabContainer.addEventListener('dragstart', (e) => {
  const tabEl = e.target.closest('.tab');
  if (!tabEl) return;
  dragTabId = Number(tabEl.dataset.tabId);
  tabEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});
tabContainer.addEventListener('dragend', (e) => {
  dragTabId = null;
  tabContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('dragging', 'drag-over-left', 'drag-over-right'));
});
tabContainer.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tabEl = e.target.closest('.tab');
  tabContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over-left', 'drag-over-right'));
  if (!tabEl || Number(tabEl.dataset.tabId) === dragTabId) return;
  const rect = tabEl.getBoundingClientRect();
  const half = (e.clientX - rect.left) < rect.width / 2;
  tabEl.classList.add(half ? 'drag-over-left' : 'drag-over-right');
});
tabContainer.addEventListener('drop', (e) => {
  e.preventDefault();
  const tabEl = e.target.closest('.tab');
  if (!tabEl || dragTabId === null) return;
  const fromIdx = tabs.findIndex(t => t.id === dragTabId);
  let toIdx = tabs.findIndex(t => t.id === Number(tabEl.dataset.tabId));
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const rect = tabEl.getBoundingClientRect();
  const insertAfter = (e.clientX - rect.left) >= rect.width / 2;
  const [moved] = tabs.splice(fromIdx, 1);
  toIdx = tabs.findIndex(t => t.id === Number(tabEl.dataset.tabId));
  tabs.splice(insertAfter ? toIdx + 1 : toIdx, 0, moved);
  renderTabs();
});

// Navigate in current tab
async function navigate(targetUrl, { pushState = true } = {}) {
  if (!targetUrl) return;
  targetUrl = normalizeUrl(targetUrl);

  // Handle search queries
  let isSearch = false;
  let searchQuery = '';
  if (targetUrl.startsWith('__search__:')) {
    isSearch = true;
    searchQuery = targetUrl.slice('__search__:'.length);
    targetUrl = '__search__:' + searchQuery;
  }

  // Handle note:// URLs
  let isNote = false;
  let notePath = '';
  if (targetUrl.startsWith('note://')) {
    isNote = true;
    notePath = targetUrl.slice('note://'.length);
  }

  const tab = getActiveTab();
  const prevUrl = tab.url;
  const prevMarkdown = tab.markdown;
  tab.url = targetUrl;
  urlInput.value = isSearch ? searchQuery : targetUrl;

  if (isNote) {
    const note = await db.getNote(notePath);
    const t0 = performance.now();
    if (note) {
      tab.markdown = note.content;
      tab.nav = [];
      rawPane.value = note.content;
      previewPane.innerHTML = markdownToHtml(note.content);
      renderNav([]);
      tab.stats = formatStats(note.content, performance.now() - t0, '(note)');
      stats.textContent = tab.stats;
      document.getElementById('copyBtn').disabled = false;
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('openBtn').style.display = 'none';
      document.getElementById('saveNoteBtn').style.display = 'none';
    } else {
      tab.markdown = '';
      tab.nav = [];
      rawPane.value = '';
      previewPane.innerHTML = '<div class="empty-state">New note. Start typing.</div>';
      renderNav([]);
      tab.stats = '';
      stats.textContent = '';
      document.getElementById('saveNoteBtn').style.display = 'none';
    }
    requestAnimationFrame(() => { rawPane.scrollTop = 0; previewPane.scrollTop = 0; });
    if (pushState) window.history.pushState({ url: targetUrl }, '', '#' + targetUrl);
    loading.style.display = 'none';
    statusEl.textContent = '';
    renderTabs();
    updateBookmarkBtn();
    if (document.querySelector('.sidebar-tab[data-sidebar="notes"]').classList.contains('active')) renderNotesSidebar();
    return;
  }

  // L1: in-memory cache, L2: IndexedDB cache
  if (!pageCache[targetUrl]) {
    const dbCached = await db.getCache(targetUrl);
    if (dbCached) pageCache[targetUrl] = { markdown: dbCached.markdown, nav: dbCached.nav };
  }
  if (pageCache[targetUrl]) {
    const cached = pageCache[targetUrl];
    tab.markdown = cached.markdown;
    tab.nav = cached.nav;
    const t0 = performance.now();
    const cachedDisplay = applyTimestamps(tab.markdown);
    rawPane.value = cachedDisplay;
    previewPane.innerHTML = markdownToHtml(cachedDisplay);
    renderNav(tab.nav);
    tab.stats = formatStats(tab.markdown, performance.now() - t0, '(cached)');
    stats.textContent = tab.stats;
    document.getElementById('copyBtn').disabled = false;
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('openBtn').style.display = '';
    document.getElementById('saveNoteBtn').style.display = isSearch ? 'none' : '';
    requestAnimationFrame(() => { rawPane.scrollTop = 0; previewPane.scrollTop = 0; });
    if (pushState) window.history.pushState({ url: targetUrl }, '', isSearch ? '#search:' + searchQuery : '#' + targetUrl);
    statusEl.textContent = '';
    renderTabs();
    return;
  }

  loading.style.display = 'block';
  statusEl.textContent = 'Fetching...';
  stats.textContent = '';
  const t0 = performance.now();

  const params = new URLSearchParams({
    url: targetUrl, nav: 'true',
    title: document.getElementById('optTitle').checked,
    links: document.getElementById('optLinks').checked,
    images: document.getElementById('optImages').checked,
    clean: document.getElementById('optClean').checked,
    absoluteUrls: document.getElementById('optAbsolute').checked,
  });

  try {
    let fetchUrl;
    if (isSearch) {
      fetchUrl = `${API_BASE}/api/search?q=${encodeURIComponent(searchQuery)}`;
    } else {
      fetchUrl = `${API_BASE}/api?${params}`;
    }
    const resp = await fetch(fetchUrl);
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
    const data = await resp.json();
    const elapsed = performance.now() - t0;

    tab.markdown = data.markdown;
    tab.nav = data.nav;
    pageCache[targetUrl] = data;
    db.setCache(targetUrl, data.markdown, data.nav);
    const h1 = data.markdown.match(/^#\s+(.+)/m);
    db.addHistory(targetUrl, h1 ? h1[1] : '');

    const fetchDisplay = applyTimestamps(tab.markdown);
    rawPane.value = fetchDisplay;
    previewPane.innerHTML = markdownToHtml(fetchDisplay);
    renderNav(tab.nav);
    tab.stats = formatStats(tab.markdown, elapsed);
    stats.textContent = tab.stats;
    document.getElementById('copyBtn').disabled = false;
    document.getElementById('downloadBtn').disabled = false;
    document.getElementById('openBtn').style.display = '';
    document.getElementById('saveNoteBtn').style.display = isSearch ? 'none' : '';
    requestAnimationFrame(() => { rawPane.scrollTop = 0; previewPane.scrollTop = 0; });
    if (pushState) window.history.pushState({ url: targetUrl }, '', isSearch ? '#search:' + searchQuery : '#' + targetUrl);
    statusEl.textContent = '';
    renderTabs();
    updateBookmarkBtn();
  } catch (e) {
    // Push error as its own history entry so back returns to previous page
    tab.url = prevUrl;
    tab.markdown = prevMarkdown;
    if (pushState) window.history.pushState({ url: prevUrl }, '', window.location.hash);
    urlInput.value = isSearch ? searchQuery : targetUrl;
    statusEl.textContent = `Error: ${e.message}`;
    previewPane.innerHTML = `<div class="empty-state">Error: ${e.message}<br><br>This page may be blocking automated traffic.</div>`;
    rawPane.value = `Error: ${e.message}`;
    renderTabs();
  } finally {
    loading.style.display = 'none';
  }
}

function renderNav(nav) {
  const ul = document.querySelector('#sidebarNav ul');
  const currentUrl = urlInput.value;
  const navArr = nav || [];
  if (navArr.length === 0) {
    ul.innerHTML = '<li class="nav-empty">Navigation will appear here for supported websites and folders</li>';
    return;
  }
  ul.innerHTML = navArr.map(n =>
    `<li><a href="${n.href}" title="${n.text}"${n.href === currentUrl ? ' class="active"' : ''}>${n.text}</a></li>`
  ).join('');
}

  const anyOpen = navSidebar.classList.contains('open') || document.getElementById('rightSidebar').classList.contains('open');
  sidebarOverlay.classList.toggle('open', anyOpen && window.innerWidth < 640);
}

  document.getElementById('rightSidebar').classList.remove('open');

// Browser back/forward
window.addEventListener('popstate', (e) => {
  if (e.state?.filePath) {
    openFileFromTree(e.state.filePath, { pushState: false });
  } else if (e.state?.url) {
    navigate(e.state.url, { pushState: false });
  } else {
    // Back to start page
    const tab = getActiveTab();
    if (tab) {
      tab.url = '';
      tab.markdown = '';
      tab.nav = [];
      tab.stats = '';
      displayTab(tab);
      loadStartPage(tab);
      renderTabs();
    }
  }
});

// Init
(async () => {
  if (!(await loadSettings())) {
    applyView('preview');
    setTheme('auto');
  }
  db.pruneCache(7);
  if (await loadTabs()) {
    renderTabs();
    displayTab(getActiveTab());
  } else {
    createTab();
    const hash = window.location.hash.slice(1);
    const targetUrl = hash || new URLSearchParams(window.location.search).get('url');
    if (targetUrl) {
      window.history.replaceState({ url: targetUrl }, '', '#' + targetUrl);
      navigate(targetUrl, { pushState: false });
    }
  }
})();

// Link interception — Ctrl/middle-click opens new tab
for (const el of [previewPane]) {
  el.addEventListener('click', (e) => {
    const link = e.target.closest('a');
    if (!link) return;
    e.preventDefault();
    const href = link.getAttribute('href');
    if (!href) return;
    if (href.startsWith('#')) { scrollToAnchor(href); return; }
    if (folderHandle) {
      const localPath = resolveFolderLinkPath(getActiveTab()?.filePath, href);
      if (localPath && findFolderFile(localPath)) {
        if (e.ctrlKey || e.metaKey || e.button === 1) createTab();
        openFileFromTree(localPath);
        return;
      }
    }
    if (e.ctrlKey || e.metaKey || e.button === 1) {
      createTab(href);
    } else {
      navigate(href);
    }
  });
  el.addEventListener('auxclick', (e) => {
    const link = e.target.closest('a');
    if (!link || e.button !== 1) return;
    e.preventDefault();
    const href = link.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    if (folderHandle) {
      const localPath = resolveFolderLinkPath(getActiveTab()?.filePath, href);
      if (localPath && findFolderFile(localPath)) { createTab(); openFileFromTree(localPath); return; }
    }
    createTab(href);
  });
}

// Interactive task-list checkboxes — clicking writes [ ]<->[x] back to the markdown.
// The clicked box maps to the Nth task marker in source order (rendered in document
// order), so we toggle that ordinal in both the editable buffer (rawPane) and the
// canonical markdown (tab.markdown), then persist by content type.
previewPane.addEventListener('change', async (e) => {
  const box = e.target.closest('input[type="checkbox"]');
  if (!box) return;
  const tab = getActiveTab();
  if (!tab) return;
  const index = [...previewPane.querySelectorAll('input[type="checkbox"]')].indexOf(box);
  if (index < 0) return;
  rawPane.value = toggleTaskAt(rawPane.value, index);
  tab.markdown = toggleTaskAt(tab.markdown, index);
  stats.textContent = formatStats(rawPane.value, 0, '(edited)');
  tab.stats = stats.textContent;
  renderTabs();
  await persistTaskToggle(tab);
});

async function persistTaskToggle(tab) {
  if (tab.url?.startsWith('note://')) {
    const notePath = tab.url.slice('note://'.length);
    await db.saveNote(notePath, tab.markdown);
    await db.updateBacklinks(notePath, parseWikiLinks(tab.markdown));
    statusEl.textContent = 'Saved';
    setTimeout(() => { statusEl.textContent = ''; }, 1500);
    if (document.querySelector('.sidebar-tab[data-sidebar="notes"]').classList.contains('active')) renderNotesSidebar();
    return;
  }
  const handle = fileHandles.get(tab.id);
  if (tab.source === 'file' && handle) {
    try {
      const writable = await handle.createWritable();
      await writable.write(rawPane.value);
      await writable.close();
      statusEl.textContent = 'Saved';
      setTimeout(() => { statusEl.textContent = ''; }, 1500);
    } catch {}
    return;
  }
  // Web-page view: keep the in-memory + IndexedDB cache copies in sync so the
  // toggle survives tab switches and reloads-from-cache.
  if (tab.url && !tab.url.startsWith('__search__')) {
    if (pageCache[tab.url]) pageCache[tab.url].markdown = tab.markdown;
    db.setCache(tab.url, tab.markdown, tab.nav);
  }
}

// File/Folder handling

// --- Local image resolution for opened folders -----------------------------
// When viewing files from an opened folder, <img> sources that point into the
// folder won't load on their own — the browser resolves them against the app
// origin, not the folder. Resolve them via the File System Access handles and
// swap in blob URLs. Supports repo-root-absolute paths ("/media/x.png", where
// "/" is the opened folder root) and paths relative to the current file.
const folderImageCache = new Map(); // "a/b/c.png" -> object URL

async function getFolderFileHandle(parts) {
  let dir = folderHandle;
  for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i]);
  return dir.getFileHandle(parts[parts.length - 1]);
}

// Turn an <img> src into path segments from the folder root, or null to skip.
function resolveImgPathParts(filePath, src) {
  if (/^[a-z][a-z0-9+.-]*:/i.test(src) || src.startsWith('//')) return null; // http:, data:, blob:, protocol-relative
  let parts;
  if (src.startsWith('/')) { parts = []; src = src.slice(1); }   // root-absolute -> opened folder root
  else { parts = (filePath || '').split('/').slice(0, -1); }     // relative -> current file's directory
  for (const seg of src.split('/')) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') parts.pop();
    else parts.push(seg);
  }
  return parts.length ? parts : null;
}

async function resolveFolderImages(filePath) {
  if (!folderHandle) return;
  for (const img of previewPane.querySelectorAll('img')) {
    if (img.dataset.resolved) continue;
    const raw = img.getAttribute('src');
    if (!raw) continue;
    let decoded; try { decoded = decodeURIComponent(raw); } catch { decoded = raw; }
    const parts = resolveImgPathParts(filePath, decoded);
    if (!parts) continue;
    const key = parts.join('/');
    try {
      let url = folderImageCache.get(key);
      if (!url) {
        const file = await (await getFolderFileHandle(parts)).getFile();
        url = URL.createObjectURL(file);
        folderImageCache.set(key, url);
      }
      img.src = url;
      img.dataset.resolved = '1';
    } catch { /* not found in folder — leave the original src in place */ }
  }
}

// Resolve an in-document link href to a folder-relative file path (or null if
// it isn't a local link — e.g. http:, note:, mailto:). Reuses the same
// scheme-skipping and ./ .. handling as image resolution.
function resolveFolderLinkPath(filePath, href) {
  if (!href) return null;
  const clean = href.split('#')[0].split('?')[0];
  if (!clean) return null;
  let decoded; try { decoded = decodeURIComponent(clean); } catch { decoded = clean; }
  const parts = resolveImgPathParts(filePath, decoded);
  return parts ? parts.join('/') : null;
}

// Find a file node in the opened folder tree by its folder-relative path.
function findFolderFile(path, items = folderTree) {
  for (const item of items) {
    if (item.kind === 'file' && item.path === path) return item;
    if (item.children) { const found = findFolderFile(path, item.children); if (found) return found; }
  }
  return null;
}

// Smooth-scroll to an in-document anchor (footnote references, back-links, etc.).
function scrollToAnchor(href) {
  let id; try { id = decodeURIComponent(href.slice(1)); } catch { id = href.slice(1); }
  if (!id) return;
  const target = previewPane.querySelector('#' + (window.CSS && CSS.escape ? CSS.escape(id) : id));
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.remove('fn-flash');
  void target.offsetWidth; // restart the flash animation on repeat clicks
  target.classList.add('fn-flash');
}

async function scanDirectory(dirHandle, prefix = '') {
  const items = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'file' && /\.(md|markdown|txt)$/i.test(name)) {
      items.push({ name, path: prefix + name, handle, kind: 'file' });
    } else if (handle.kind === 'directory' && !name.startsWith('.') && name !== 'node_modules') {
      const children = await scanDirectory(handle, prefix + name + '/');
      if (children.length) items.push({ name, path: prefix + name, handle, kind: 'dir', children });
    }
  }
  return items.sort((a, b) => (a.kind === b.kind ? a.name.localeCompare(b.name) : a.kind === 'dir' ? -1 : 1));
}

function renderFileTree(tree, depth = 0) {
  const ul = document.querySelector('#sidebarNav ul');
  const activeTab = getActiveTab();
  const activePath = activeTab?.filePath || '';

  const chevron = '<span class="icon icon-chevron-right"></span>';

  function buildHtml(items, depth) {
    let html = '';
    for (const item of items) {
      const pad = `padding-left: ${16 + depth * 14}px`;
      if (item.kind === 'dir') {
        html += `<li class="file-tree-group open">`;
        html += `<div class="file-tree-dir" style="${pad}" data-path="${item.path}">${chevron}${item.name}</div>`;
        html += `<ul class="file-tree-children">${item.children ? buildHtml(item.children, depth + 1) : ''}</ul>`;
        html += `</li>`;
      } else {
        const active = item.path === activePath ? ' active' : '';
        html += `<li><a class="file-tree-item${active}" style="${pad}" data-path="${item.path}">${item.name}</a></li>`;
      }
    }
    return html;
  }

  ul.innerHTML = buildHtml(tree, 0);
}

async function openFileFromTree(path, { pushState = true } = {}) {
  // Find the handle by walking the tree
  function findHandle(items, target) {
    for (const item of items) {
      if (item.path === target && item.kind === 'file') return item.handle;
      if (item.children) { const h = findHandle(item.children, target); if (h) return h; }
    }
    return null;
  }
  const handle = findHandle(folderTree, path);
  if (!handle) return;
  const file = await handle.getFile();
  const text = await file.text();
  const tab = getActiveTab();
  tab.source = 'file';
  tab.filePath = path;
  tab.markdown = text;
  tab.url = '';
  tab.nav = [];
  fileHandles.set(tab.id, handle);
  rawPane.value = text;
  previewPane.innerHTML = markdownToHtml(text);
  resolveFolderImages(path);
  document.getElementById('copyBtn').disabled = false;
  document.getElementById('downloadBtn').disabled = false;
  document.getElementById('openBtn').disabled = true;
  urlInput.value = path;
  stats.textContent = formatStats(text, 0);
  tab.stats = stats.textContent;
  renderTabs();
  renderFileTree(folderTree);
  if (pushState) window.history.pushState({ filePath: path }, '', '#file:' + path);
  requestAnimationFrame(() => { rawPane.scrollTop = 0; previewPane.scrollTop = 0; });
}

// Save (Ctrl+S)
async function saveFile() {
  const tab = getActiveTab();
  if (!tab?.markdown && !rawPane.value) return;

  // Save note to IndexedDB
  if (tab.url?.startsWith('note://')) {
    const notePath = tab.url.slice('note://'.length);
    tab.markdown = rawPane.value;
    await db.saveNote(notePath, rawPane.value);
    const targets = parseWikiLinks(rawPane.value);
    await db.updateBacklinks(notePath, targets);
    statusEl.textContent = 'Saved';
    setTimeout(() => { statusEl.textContent = ''; }, 1500);
    renderTabs();
    if (document.querySelector('.sidebar-tab[data-sidebar="notes"]').classList.contains('active')) renderNotesSidebar();
    return;
  }

  let handle = fileHandles.get(tab.id);
  if (!handle && window.showSaveFilePicker) {
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: (tab.filePath || 'document') + (tab.filePath?.endsWith('.md') ? '' : '.md'),
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }],
      });
      fileHandles.set(tab.id, handle);
      tab.source = 'file';
      tab.filePath = handle.name;
    } catch { return; }
  }
  if (handle) {
    const writable = await handle.createWritable();
    await writable.write(rawPane.value);
    await writable.close();
  } else {
    const name = (tab.filePath || 'document').replace(/\.md$/, '') + '.md';
    const blob = new Blob([rawPane.value], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  tab.markdown = rawPane.value;
  statusEl.textContent = 'Saved';
  setTimeout(() => { statusEl.textContent = ''; }, 1500);
  renderTabs();
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const tab = getActiveTab();
  if (!tab?.markdown) return;
  const h1Match = tab.markdown.match(/^#\s+(.+)/m);
  let slug;
  if (h1Match) {
    slug = h1Match[1].trim().toLowerCase()
      .replace(/[^\w\s-]/g, '').replace(/[\s_]+/g, '-').replace(/-+/g, '-')
      .replace(/^-|-$/g, '').slice(0, 80);
  }
  if (!slug) {
    try { slug = new URL(tab.url).pathname.replace(/\/$/, '').split('/').pop() || 'page'; }
    catch { slug = 'page'; }
  }
  const blob = new Blob([tab.markdown], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = slug + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
});

// Notes sidebar
function buildNoteTree(entries) {
  const root = [];
  const folders = {};
  // First pass: register explicit folders
  for (const entry of entries) {
    if (entry.kind === 'folder') {
      const parts = entry.path.split('/');
      let parent = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const fp = parts.slice(0, i + 1).join('/');
        if (!folders[fp]) {
          const node = { name: parts[i], path: fp, kind: 'folder', children: [] };
          folders[fp] = node;
          parent.push(node);
        }
        parent = folders[fp].children;
      }
      if (!folders[entry.path]) {
        const node = { name: parts[parts.length - 1], path: entry.path, kind: 'folder', children: [] };
        folders[entry.path] = node;
        parent.push(node);
      }
    }
  }
  // Second pass: place notes (create implicit folders for any missing segments)
  for (const entry of entries) {
    if (entry.kind === 'folder') continue;
    const parts = entry.path.split('/');
    let parent = root;
    for (let i = 0; i < parts.length - 1; i++) {
      const fp = parts.slice(0, i + 1).join('/');
      if (!folders[fp]) {
        const node = { name: parts[i], path: fp, kind: 'folder', children: [] };
        folders[fp] = node;
        parent.push(node);
      }
      parent = folders[fp].children;
    }
    parent.push({ name: parts[parts.length - 1], path: entry.path, kind: 'note' });
  }
  function sortTree(items) {
    items.sort((a, b) => {
      const aDir = a.kind === 'folder' ? 0 : 1;
      const bDir = b.kind === 'folder' ? 0 : 1;
      return aDir - bDir || a.name.localeCompare(b.name);
    });
    for (const item of items) if (item.children) sortTree(item.children);
  }
  sortTree(root);
  return root;
}

function buildNoteTreeHtml(items, depth, activePath, collapsed) {
  const chevron = '<span class="icon icon-chevron-right"></span>';
  const addIcon = '<span class="icon icon-plus"></span>';
  let html = '';
  for (const item of items) {
    const folderPad = `padding-left: ${16 + depth * 14}px`;
    const notePad = `padding-left: ${30 + depth * 14}px`;
    if (item.kind === 'folder') {
      const isOpen = !collapsed.has(item.path);
      html += `<li class="file-tree-group${isOpen ? ' open' : ''}" draggable="true" data-drag-path="${item.path}" data-drag-kind="folder">`;
      html += `<div class="file-tree-dir" style="${folderPad}" data-path="${item.path}">${chevron}<span class="file-tree-name">${esc(item.name)}</span><button class="tree-add-btn" data-parent="${item.path}">${addIcon}</button></div>`;
      html += `<ul class="file-tree-children">${buildNoteTreeHtml(item.children, depth + 1, activePath, collapsed)}</ul>`;
      html += `</li>`;
    } else {
      const active = item.path === activePath ? ' active' : '';
      html += `<li draggable="true" data-drag-path="${item.path}" data-drag-kind="note"><a class="file-tree-item note-tree-item${active}" style="${notePad}" data-path="${item.path}">${esc(item.name)}</a></li>`;
    }
  }
  return html;
}

  dragPath = null;

  notesEl.querySelectorAll('.dragging, .drop-target').forEach(el => {
    el.classList.remove('dragging', 'drop-target');
  });
});

notesEl.addEventListener('dragover', (e) => {
  if (!dragPath) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  notesEl.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  // Find drop target: a folder dir or the sidebarNotes root (for moving to root)
  const dir = e.target.closest('.file-tree-dir');
  if (dir) {
    const targetPath = dir.dataset.path;
    // Don't allow dropping onto self or own children
    if (targetPath === dragPath || targetPath.startsWith(dragPath + '/')) return;
    dir.classList.add('drop-target');
  }
});

notesEl.addEventListener('dragleave', (e) => {
  const dir = e.target.closest('.file-tree-dir');
  if (dir) dir.classList.remove('drop-target');
});

notesEl.addEventListener('drop', (e) => {
  e.preventDefault();
  notesEl.querySelectorAll('.drop-target, .dragging').forEach(el => {
    el.classList.remove('drop-target', 'dragging');
  });
  if (!dragPath) return;
  const dir = e.target.closest('.file-tree-dir');
  const targetFolder = dir ? dir.dataset.path : '';
  // Don't drop onto self or own children
  if (targetFolder === dragPath || targetFolder.startsWith(dragPath + '/')) return;
  // Compute new path
  const name = dragPath.includes('/') ? dragPath.slice(dragPath.lastIndexOf('/') + 1) : dragPath;
  const newPath = targetFolder ? targetFolder + '/' + name : name;
  if (newPath === dragPath) return;
  db.renameNote(dragPath, newPath).then(() => {
    // Update current tab URL if viewing the moved item
    const tab = getActiveTab();
    if (tab?.url === 'note://' + dragPath) {
      tab.url = 'note://' + newPath;
      urlInput.value = 'note://' + newPath;
      window.history.replaceState({ url: tab.url }, '', '#' + tab.url);
    } else if (tab?.url?.startsWith('note://' + dragPath + '/')) {
      const suffix = tab.url.slice(('note://' + dragPath).length);
      tab.url = 'note://' + newPath + suffix;
      urlInput.value = tab.url;
      window.history.replaceState({ url: tab.url }, '', '#' + tab.url);
    }
    dragPath = null;
    dragKind = null;
    renderNotesSidebar();
  });
});

// Also allow dropping on the root area (outside any folder) to move to root
notesEl.addEventListener('dragover', (e) => {
  if (!dragPath) return;
  // If not over a folder dir, allow drop for moving to root
  if (!e.target.closest('.file-tree-dir') && !e.target.closest('.note-tree-item')) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }
});

// Modal helper (replaces native prompt/confirm)
function showModal({ title, value = '', placeholder = '', okLabel = 'OK', okClass = 'modal-ok', input = true }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    box.innerHTML = `<h3>${esc(title)}</h3>` +
      (input ? `<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" spellcheck="false">` : '') +
      `<div class="modal-actions"><button class="modal-cancel">Cancel</button><button class="${okClass}">${esc(okLabel)}</button></div>`;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const inp = box.querySelector('input');
    const okBtn = box.querySelector('.' + okClass.split(' ')[0]);
    const cancelBtn = box.querySelector('.modal-cancel');
    if (inp) { inp.focus(); inp.select(); }
    else okBtn.focus();
    function close(result) { overlay.remove(); resolve(result); }
    cancelBtn.onclick = () => close(null);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(null); });
    okBtn.onclick = () => close(input ? inp.value : true);
    if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') close(inp.value); if (e.key === 'Escape') close(null); });
    box.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(null); });
  });
}

// Notes context menu
let noteContextMenu = null;
function closeNoteContextMenu() {
  if (noteContextMenu) { noteContextMenu.remove(); noteContextMenu = null; }
}
document.addEventListener('click', closeNoteContextMenu);

document.getElementById('sidebarNotes').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  closeNoteContextMenu();
  const item = e.target.closest('.note-tree-item');
  const dir = e.target.closest('.file-tree-dir');
  const targetPath = item?.dataset.path || dir?.dataset.path || '';
  const isDir = !!dir;
  const isNote = !!item;

  const menu = document.createElement('div');
  menu.className = 'note-context-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  const contextParent = isDir ? targetPath : (targetPath.includes('/') ? targetPath.slice(0, targetPath.lastIndexOf('/')) : '');

  // New Note (on folders and empty area)
  if (isDir || !isNote) {
    const newNoteBtn = document.createElement('button');
    newNoteBtn.textContent = 'New Note';
    newNoteBtn.onclick = () => {
      closeNoteContextMenu();
      showModal({ title: 'New Note', placeholder: 'name' }).then(name => {
        if (!name) return;
        const path = contextParent ? contextParent + '/' + name : name;
        db.saveNote(path, '').then(() => { navigate('note://' + path); renderNotesSidebar(); });
      });
    };
    menu.appendChild(newNoteBtn);

    const newFolderBtn = document.createElement('button');
    newFolderBtn.textContent = 'New Folder';
    newFolderBtn.onclick = () => {
      closeNoteContextMenu();
      showModal({ title: 'New Folder', placeholder: 'name' }).then(name => {
        if (!name) return;
        const path = contextParent ? contextParent + '/' + name : name;
        db.createFolder(path).then(() => renderNotesSidebar());
      });
    };
    menu.appendChild(newFolderBtn);
  }

  if (isNote || isDir) {
    // Rename
    const renameBtn = document.createElement('button');
    renameBtn.textContent = 'Rename';
    renameBtn.onclick = () => {
      closeNoteContextMenu();
      const oldName = targetPath.includes('/') ? targetPath.slice(targetPath.lastIndexOf('/') + 1) : targetPath;
      const renamedParent = targetPath.includes('/') ? targetPath.slice(0, targetPath.lastIndexOf('/')) : '';
      showModal({ title: 'Rename', value: oldName }).then(newName => {
        if (!newName || newName === oldName) return;
        const newPath = renamedParent ? renamedParent + '/' + newName : newName;
        db.renameNote(targetPath, newPath).then(() => {
          const tab = getActiveTab();
          if (tab?.url === 'note://' + targetPath) {
            tab.url = 'note://' + newPath;
            urlInput.value = 'note://' + newPath;
            window.history.replaceState({ url: tab.url }, '', '#' + tab.url);
          }
          renderNotesSidebar();
        });
      });
    };
    menu.appendChild(renameBtn);

    // Delete
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.onclick = () => {
      closeNoteContextMenu();
      const msg = isDir ? 'Delete folder "' + targetPath + '" and all its contents?' : 'Delete "' + targetPath + '"?';
      showModal({ title: msg, input: false, okLabel: 'Delete', okClass: 'modal-danger' }).then(ok => {
        if (!ok) return;
        db.deleteNote(targetPath).then(() => {
          const tab = getActiveTab();
          if (tab?.url?.startsWith('note://' + targetPath)) navigate('');
          renderNotesSidebar();
        });
      });
    };
    menu.appendChild(deleteBtn);
  }

  document.body.appendChild(menu);
  noteContextMenu = menu;
  const rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + 'px';
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + 'px';
});

// Save to Notes button
document.getElementById('saveNoteBtn').addEventListener('click', async () => {
  const tab = getActiveTab();
  if (!tab?.markdown) return;
  const h1 = tab.markdown.match(/^#\s+(.+)/m);
  const title = h1 ? h1[1] : 'untitled';
  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  const path = await showModal({ title: 'Save to Notes', value: 'archive/' + slug });
  if (!path) return;
  await db.saveNote(path, tab.markdown, { sourceUrl: tab.url, archivedAt: Date.now() });
  navigate('note://' + path);
});

// Bookmarks
const bookmarkBtn = document.getElementById('bookmarkBtn');
async function updateBookmarkBtn() {
  const tab = getActiveTab();
  if (!tab?.url) { bookmarkBtn.disabled = true; bookmarkBtn.classList.remove('active'); return; }
  bookmarkBtn.disabled = false;
  bookmarkBtn.classList.toggle('active', await db.isBookmarked(tab.url));
}
bookmarkBtn.addEventListener('click', async () => {
  const tab = getActiveTab();
  if (!tab?.url) return;
  if (await db.isBookmarked(tab.url)) {
    await db.removeBookmark(tab.url);
  } else {
    const h1 = tab.markdown?.match(/^#\s+(.+)/m);
    await db.addBookmark(tab.url, h1 ? h1[1] : tab.url);
  }
  updateBookmarkBtn();
});

async function renderBookmarksSidebar() {
  const el = document.getElementById('sidebarBookmarks');
  const bookmarks = await db.getBookmarks();
  if (!bookmarks.length) {
    el.innerHTML = '<div class="nav-empty" style="padding:16px;color:var(--color-text-placeholder);text-align:center;font-style:italic">No bookmarks yet</div>';
    return;
  }
  el.innerHTML = bookmarks.map(b =>
    `<a class="bookmark-item" data-url="${b.url}" title="${b.url}"><img class="sidebar-icon" src="${faviconUrl(b.url)}">${b.title || b.url}</a>`
  ).join('');
}

document.getElementById('sidebarBookmarks').addEventListener('click', (e) => {
  const item = e.target.closest('.bookmark-item');
  if (!item) return;
  const url = item.dataset.url;
  if (e.ctrlKey || e.metaKey) createTab(url);
  else navigate(url);
});

// History sidebar
async function renderHistorySidebar() {
  const el = document.getElementById('sidebarHistory');
  const history = await db.getHistory(100);
  if (!history.length) {
    el.innerHTML = '<div class="nav-empty" style="padding:16px;color:var(--color-text-placeholder);text-align:center;font-style:italic">No history yet</div>';
    return;
  }
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yesterday = today - 86400000;
  const week = today - 7 * 86400000;
  let html = '';
  let section = '';
  for (const h of history) {
    let label;
    if (h.timestamp >= today) label = 'Today';
    else if (h.timestamp >= yesterday) label = 'Yesterday';
    else if (h.timestamp >= week) label = 'Last 7 days';
    else label = 'Older';
    if (label !== section) { section = label; html += `<div class="history-date">${label}</div>`; }
    html += `<a class="history-item" data-url="${h.url}" title="${h.url}"><img class="sidebar-icon" src="${faviconUrl(h.url)}">${h.title || h.url}</a>`;
  }
  el.innerHTML = html;
}

document.getElementById('sidebarHistory').addEventListener('click', (e) => {
  const item = e.target.closest('.history-item');
  if (!item) return;
  const url = item.dataset.url;
  if (e.ctrlKey || e.metaKey) createTab(url);
  else navigate(url);
});

// URL autocomplete
const autocomplete = document.getElementById('autocomplete');
let acIndex = -1;

urlInput.addEventListener('input', debounce(async () => {
  const q = urlInput.value.trim();
  if (!q || q.startsWith('http://') || q.startsWith('https://')) {
    // Only autocomplete partial queries, not full URLs
    if (q.length < 5) { autocomplete.classList.remove('open'); return; }
  }
  const [histResults, bookmarks] = await Promise.all([
    db.searchHistory(q),
    db.getBookmarks(),
  ]);
  const bmMatches = bookmarks.filter(b =>
    b.url.toLowerCase().includes(q.toLowerCase()) || (b.title && b.title.toLowerCase().includes(q.toLowerCase()))
  );
  const seen = new Set();
  const items = [];
  for (const b of bmMatches.slice(0, 3)) {
    if (seen.has(b.url)) continue; seen.add(b.url);
    items.push({ title: b.title, url: b.url, star: true });
  }
  for (const h of histResults.slice(0, 8)) {
    if (seen.has(h.url)) continue; seen.add(h.url);
    items.push({ title: h.title, url: h.url, star: false });
  }
  if (!items.length) { autocomplete.classList.remove('open'); return; }
  acIndex = -1;
  autocomplete.innerHTML = items.map((it, i) =>
    `<div class="ac-item" data-url="${it.url}" data-index="${i}">` +
    `<img class="sidebar-icon" src="${faviconUrl(it.url)}">` +
    `<div><span class="ac-title">${it.star ? '<span class="ac-star">&#9733;</span>' : ''}${it.title || it.url}</span>` +
    `<span class="ac-url">${it.url}</span></div></div>`
  ).join('');
  autocomplete.classList.add('open');
}, 100));

autocomplete.addEventListener('click', (e) => {
  const item = e.target.closest('.ac-item');
  if (!item) return;
  autocomplete.classList.remove('open');
  navigate(item.dataset.url);
});

urlInput.addEventListener('keydown', (e) => {
  if (!autocomplete.classList.contains('open')) return;
  const items = autocomplete.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, items.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, -1); }
  else if (e.key === 'Enter' && acIndex >= 0) { e.preventDefault(); autocomplete.classList.remove('open'); navigate(items[acIndex].dataset.url); return; }
  else if (e.key === 'Escape') { autocomplete.classList.remove('open'); return; }
  else return;
  items.forEach((it, i) => it.classList.toggle('selected', i === acIndex));
});

urlInput.addEventListener('blur', () => {
  setTimeout(() => autocomplete.classList.remove('open'), 200);
});

// Resizable divider
let dragging = false;
divider.addEventListener('mousedown', (e) => {
  dragging = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const panes = document.querySelector('.panes');
  const rect = panes.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const clamped = Math.max(0.15, Math.min(0.85, ratio));
  rawPane.style.flex = `0 0 ${clamped * 100}%`;
  previewPane.style.flex = `0 0 ${(1 - clamped) * 100}%`;
});
document.addEventListener('mouseup', () => {
  if (dragging) {
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});
// Touch support for divider
divider.addEventListener('touchstart', (e) => {
  dragging = true;
  document.body.style.userSelect = 'none';
  e.preventDefault();
});
document.addEventListener('touchmove', (e) => {
  if (!dragging) return;
  const panes = document.querySelector('.panes');
  const rect = panes.getBoundingClientRect();
  const touch = e.touches[0];
  const ratio = (touch.clientX - rect.left) / rect.width;
  const clamped = Math.max(0.15, Math.min(0.85, ratio));
  rawPane.style.flex = `0 0 ${clamped * 100}%`;
  previewPane.style.flex = `0 0 ${(1 - clamped) * 100}%`;
});
document.addEventListener('touchend', () => {
  if (dragging) {
    dragging = false;
    document.body.style.userSelect = '';
  }
});

// Zen mode
const zenBtn = document.getElementById('zenBtn');
const zenExitBtn = document.getElementById('zenExitBtn');
zenBtn.addEventListener('click', () => {
  const rect = zenBtn.getBoundingClientRect();
  zenExitBtn.style.bottom = (window.innerHeight - rect.bottom) + 'px';
  zenExitBtn.style.right = (window.innerWidth - rect.right) + 'px';
  document.body.classList.add('zen');
});
zenExitBtn.addEventListener('click', () => document.body.classList.remove('zen'));

// Edge-swipe navigation (mobile PWA)
let swipeStartX = 0, swipeStartY = 0;
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (t.clientX < 20 || t.clientX > window.innerWidth - 20) {
    swipeStartX = t.clientX;
    swipeStartY = t.clientY;
  } else {
    swipeStartX = -1;
  }
});
document.addEventListener('touchend', (e) => {
  if (swipeStartX < 0) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = Math.abs(t.clientY - swipeStartY);
  if (dy > Math.abs(dx)) return;
  if (swipeStartX < 20 && dx > 80) history.back();
  if (swipeStartX > window.innerWidth - 20 && dx < -80) history.forward();
});

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
